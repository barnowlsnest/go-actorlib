<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-label="Animation: Player, World and Monster actors exchanging messages through their mailboxes">
<title>Animation: Player, World and Monster actors exchanging messages through their mailboxes</title>

<style>
  :root{--bg:#ffffff;--panel:#f6f8fa;--border:#d0d7de;--fg:#1f2328;--muted:#59636e;
        --accent:#0969da;--ok:#1a7f37;--bad:#cf222e;--warn:#9a6700;
        --c1:#0969da;--c2:#8250df;--c3:#bf3989;--c4:#1a7f37;}
  @media (prefers-color-scheme: dark){
    :root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--fg:#e6edf3;--muted:#9198a1;
          --accent:#4493f8;--ok:#3fb950;--bad:#f85149;--warn:#d29922;
          --c1:#4493f8;--c2:#a371f7;--c3:#db61a2;--c4:#3fb950;}
  }
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .bg{fill:var(--bg);stroke:var(--border)}
  .panel{fill:var(--panel);stroke:var(--border);stroke-width:1.5}
  .muted{fill:var(--muted)}
  .title{font-size:16px;font-weight:600}
  .small{font-size:12px}
  .tiny{font-size:11px}
  .slot{fill:none;stroke:var(--border);stroke-width:1.5;stroke-dasharray:4 3}
  .edge{fill:none;stroke:var(--border);stroke-width:1.5}
  .chiptext{font-size:12px;font-weight:600;fill:#ffffff}
  .ok{fill:var(--ok)} .bad{fill:var(--bad)} .warn{fill:var(--warn)} .accent{fill:var(--accent)}
  .okS{stroke:var(--ok)} .badS{stroke:var(--bad)} .accentS{stroke:var(--accent)}
</style>
<rect class="bg" x="0.5" y="0.5" width="859" height="329" rx="12"/>
<text class="title" x="24" y="34">Every entity is an actor</text>
<text class="small muted" x="24" y="54">Its own goroutine, its own mailbox, private state. Entities interact only by sending messages.</text>
<rect class="panel" x="330" y="78" width="200" height="92" rx="10"/>
<text class="title mono" x="344" y="102">Actor[World]</text>
<text class="small muted" x="344" y="124">players: 1, monsters: 1</text>
<text class="tiny muted" x="344" y="154">mailbox</text>
<rect class="slot" x="400" y="142" width="20" height="16" rx="3"/>
<rect class="slot" x="426" y="142" width="20" height="16" rx="3"/>
<rect class="slot" x="452" y="142" width="20" height="16" rx="3"/>
<rect class="slot" x="478" y="142" width="20" height="16" rx="3"/>
<rect class="panel" x="60" y="210" width="200" height="92" rx="10"/>
<text class="title mono" x="74" y="234">Actor[Player]</text>
<text class="tiny muted" x="74" y="286">mailbox</text>
<rect class="slot" x="130" y="274" width="20" height="16" rx="3"/>
