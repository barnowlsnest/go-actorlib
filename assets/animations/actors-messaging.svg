<rect class="panel" x="600" y="210" width="200" height="92" rx="10"/>
<text class="title mono" x="614" y="234">Actor[Monster]</text>
<text class="tiny muted" x="614" y="286">mailbox</text>
<rect class="slot" x="670" y="274" width="20" height="16" rx="3"/>
<rect class="slot" x="696" y="274" width="20" height="16" rx="3"/>
<rect class="slot" x="722" y="274" width="20" height="16" rx="3"/>
<rect class="slot" x="748" y="274" width="20" height="16" rx="3"/>
<text class="small muted" x="74" y="256">hp: <tspan class="mono">100</tspan><animate attributeName="opacity" dur="8.0s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0.0000;0.6488;0.6500;0.9988;1.0000"/></text><text class="small" x="74" y="256" opacity="0">hp: <tspan class="mono bad">88</tspan><animate attributeName="opacity" dur="8.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.6488;0.6500;0.9625;0.9637;1.0000"/></text>
<text class="small muted" x="614" y="256">hp: <tspan class="mono">50</tspan><animate attributeName="opacity" dur="8.0s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0.0000;0.8738;0.8750;0.9988;1.0000"/></text><text class="small" x="614" y="256" opacity="0">hp: <tspan class="mono bad">20</tspan><animate attributeName="opacity" dur="8.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.8738;0.8750;0.9625;0.9637;1.0000"/></text>
<path class="edge" d="M200 210 C 220 150, 270 125, 330 125" stroke-dasharray="3 4"/>
<g opacity="0"><rect x="-32.0" y="-13.0" width="64" height="26" rx="6" style="fill:var(--c1)"/><text class="chiptext mono" x="0" y="4" text-anchor="middle">Move</text><animate attributeName="opacity" dur="8.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.0488;0.0500;0.2000;0.2250;1.0000"/><animateMotion dur="8.0s" repeatCount="indefinite" path="M200 210 C 220 150, 270 125, 330 125" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0500;0.2000;1"/></g>
