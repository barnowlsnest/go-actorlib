<rect x="600" y="210" width="200" height="92" rx="10" fill="none" class="accentS" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="8.0s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0.0000;0.3988;0.4000;0.4750;1.0000"/></rect>
<path class="edge" d="M600 270 C 480 300, 380 300, 260 270" stroke-dasharray="3 4"/>
<g opacity="0"><rect x="-32.0" y="-13.0" width="64" height="26" rx="6" style="fill:var(--c3)"/><text class="chiptext mono" x="0" y="4" text-anchor="middle">Attack</text><animate attributeName="opacity" dur="8.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.4488;0.4500;0.6250;0.6500;1.0000"/><animateMotion dur="8.0s" repeatCount="indefinite" path="M600 270 C 480 300, 380 300, 260 270" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4500;0.6250;1"/></g>
<rect x="130" y="274" width="20" height="16" rx="3" style="fill:var(--c3)" opacity="0"><animate attributeName="opacity" dur="8.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.6238;0.6250;0.6875;0.7000;1.0000"/></rect>
<rect x="60" y="210" width="200" height="92" rx="10" fill="none" class="accentS" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="8.0s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0.0000;0.6238;0.6250;0.7000;1.0000"/></rect>
<path class="edge" d="M260 240 C 380 215, 480 215, 600 240" stroke-dasharray="3 4"/>
<g opacity="0"><rect x="-32.0" y="-13.0" width="64" height="26" rx="6" style="fill:var(--c4)"/><text class="chiptext mono" x="0" y="4" text-anchor="middle">Hit</text><animate attributeName="opacity" dur="8.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.6738;0.6750;0.8500;0.8750;1.0000"/><animateMotion dur="8.0s" repeatCount="indefinite" path="M260 240 C 380 215, 480 215, 600 240" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6750;0.8500;1"/></g>
