<rect x="330" y="78" width="200" height="92" rx="10" fill="none" class="accentS" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="8.0s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0.0000;0.1988;0.2000;0.2750;1.0000"/></rect>
