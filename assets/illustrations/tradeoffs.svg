<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="Benefits and limitations of go-actorlib">
<title>Benefits and limitations of go-actorlib</title>

<style>
  :root{--bg:#ffffff;--panel:#f6f8fa;--border:#d0d7de;--fg:#1f2328;--muted:#59636e;
        --accent:#0969da;--ok:#1a7f37;--bad:#cf222e;--warn:#9a6700;
        --c1:#0969da;--c2:#8250df;--c3:#bf3989;--c4:#1a7f37;}
  @media (prefers-color-scheme: dark){
    :root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--fg:#e6edf3;--muted:#9198a1;
          --accent:#4493f8;--ok:#3fb950;--bad:#f85149;--warn:#d29922;
          --c1:#4493f8;--c2:#a371f7;--c3:#db61a2;--c4:#3fb950;}
  }
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .bg{fill:var(--bg);stroke:var(--border)}
  .panel{fill:var(--panel);stroke:var(--border);stroke-width:1.5}
  .muted{fill:var(--muted)}
  .title{font-size:16px;font-weight:600}
  .small{font-size:12px}
  .tiny{font-size:11px}
  .slot{fill:none;stroke:var(--border);stroke-width:1.5;stroke-dasharray:4 3}
  .edge{fill:none;stroke:var(--border);stroke-width:1.5}
  .chiptext{font-size:12px;font-weight:600;fill:#ffffff}
  .ok{fill:var(--ok)} .bad{fill:var(--bad)} .warn{fill:var(--warn)} .accent{fill:var(--accent)}
  .okS{stroke:var(--ok)} .badS{stroke:var(--bad)} .accentS{stroke:var(--accent)}
</style>
<rect class="bg" x="0.5" y="0.5" width="859" height="299" rx="12"/>
<rect class="panel" x="20" y="20" width="400" height="260" rx="10"/>
<text class="title ok" x="40" y="52">Benefits</text>
<text class="ok" x="42" y="88" font-weight="700" font-size="14">✓</text>
<text class="small" x="64" y="88" font-size="13">No locks around entity state</text>
<text class="ok" x="42" y="120" font-weight="700" font-size="14">✓</text>
<text class="small" x="64" y="120" font-size="13">Commands run one at a time, in order</text>
<text class="ok" x="42" y="152" font-weight="700" font-size="14">✓</text>
<text class="small" x="64" y="152" font-size="13">Typed entities and commands (generics)</text>
<text class="ok" x="42" y="184" font-weight="700" font-size="14">✓</text>
<text class="small" x="64" y="184" font-size="13">Panics contained: Recovery + supervisor restarts</text>
<text class="ok" x="42" y="216" font-weight="700" font-size="14">✓</text>
<text class="small" x="64" y="216" font-size="13">Structured start / stop, graceful shutdown</text>
<text class="ok" x="42" y="248" font-weight="700" font-size="14">✓</text>
<text class="small" x="64" y="248" font-size="13">Bounded mailboxes push back on overload</text>
<rect class="panel" x="440" y="20" width="400" height="260" rx="10"/>
<text class="title bad" x="460" y="52">Limitations</text>
<text class="bad" x="462" y="88" font-weight="700" font-size="14">✕</text>
<text class="small" x="484" y="88" font-size="13">Single process: no remoting or clustering</text>
<text class="bad" x="462" y="120" font-weight="700" font-size="14">✕</text>
<text class="small" x="484" y="120" font-size="13">Every call is a channel hop (latency)</text>
<text class="bad" x="462" y="152" font-weight="700" font-size="14">✕</text>
<text class="small" x="484" y="152" font-size="13">Full mailbox: senders block, then time out</text>
<text class="bad" x="462" y="184" font-weight="700" font-size="14">✕</text>
<text class="small" x="484" y="184" font-size="13">In-memory state only: no built-in persistence</text>
<text class="bad" x="462" y="216" font-weight="700" font-size="14">✕</text>
<text class="small" x="484" y="216" font-size="13">Stack traces stop at the channel boundary</text>
<text class="bad" x="462" y="248" font-weight="700" font-size="14">✕</text>
<text class="small" x="484" y="248" font-size="13">Overkill for a counter or simple fan-out</text>
</svg>
