# https://taskfile.dev

version: '3'

vars:
  ALL_GO_FILES: ./...

tasks:
  go-tidy:
    desc: Update all dependencies
    cmds:
      - go mod tidy

  go-build:
    desc: Build all packages
    cmds:
      - go build '{{.ALL_GO_FILES}}'

  go-fmt:
    desc: Format all Go files
    cmds:
      - go fmt '{{.ALL_GO_FILES}}'

  go-vet:
    desc: Run static analysis
    cmds:
      - go vet '{{.ALL_GO_FILES}}'

  go-test:
    desc: Run all tests
    cmds:
      - go test -race -cover '{{.ALL_GO_FILES}}'
      - go test -race -bench=. '{{.ALL_GO_FILES}}'

  go-lint-fix:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run --fix

  docs-diagrams:
    desc: Render docs/*.puml to PNG in assets/diagrams (requires Docker)
    cmds:
      - mkdir -p assets/diagrams
      - docker run --rm -v "$PWD/docs:/data" -v "$PWD/assets/diagrams:/out" plantuml/plantuml:1.2024.7 -tpng -o /out '/data/*.puml'
      - mv -f assets/diagrams/go-actorlib-architecture.png assets/diagrams/architecture.png

  docs-animations:
    desc: Generate README animated SVGs and illustrations in assets/ (requires Python 3)
    cmds:
      - python3 scripts/gen_readme_svgs.py assets

  sanity:
    desc: Run all checks (fmt, build, test, vet)
    deps:
      - go-tidy
      - go-fmt
      - go-lint-fix
      - go-build
      - go-vet
      - go-test

